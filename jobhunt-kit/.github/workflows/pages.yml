name: pages
# The web app on GitHub Pages, with today's job feeds. Runs daily and on every change to web/ or feed/.
# Setup once: Settings → Pages → Source: "GitHub Actions".

on:
  schedule:
    - cron: "17 13 * * *"      # daily, ~6 am Pacific
  push:
    branches: [main]
    paths: ["web/**", "feed/**", "jobhunt/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Build job feeds
        run: |
          for f in intern newgrad; do
            jobhunt --workspace "feed/$f" fetch
            jobhunt --workspace "feed/$f" feed --out "web/feed/$f.json"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

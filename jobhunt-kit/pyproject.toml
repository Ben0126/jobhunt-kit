[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt-kit"
version = "0.1.0"
description = "A job-search workspace you run with Claude Code: daily job feeds from pluggable sources, fact-checked tailored resumes, versioned submissions, follow-up tracking."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6",
  "Jinja2>=3.1",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.60"]
gemini = ["google-genai>=1.0"]
llm = ["anthropic>=1.0", "openai>=1.60", "google-genai>=1.0"]
mcp = ["mcp>=1.10"]
dev = ["pytest>=8"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
include = ["jobhunt*"]

[tool.setuptools.package-data]
"jobhunt" = ["resume/render/templates/*", "scaffold/workspace/**/*", "scaffold/workspace/**/.*", "scaffold/workspace/.*/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

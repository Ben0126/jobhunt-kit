# jobhunt.yaml: settings for this job-search folder. The AI may read it, never change it.

language: en           # interface and tracker status words in English
market: us             # job market: tw Taiwan, us United States
paper: letter          # paper: a4 or letter
kit_format: folder-v0  # this folder was made from the folder-format v0 kit (lets later versions recognise it and move data)
update_check: true    # The program asks GitHub at most once a day whether a newer version exists (version number only, none of your information). To turn the reminder off, change true to false.

resume:
  source: resume.yaml
  paper: letter        # for the existing Python tools; keep equal to paper above
  voice:
    # Words that are always filler on a resume. The checker already bans its built-in list (proven, passionate,
    # synergy, leverage, robust and so on), so those are not repeated here. Words that can be backed by an event
    # (detail-oriented, reliable) are left out on purpose: the AI checks those by hand.
    extra_words:
      - results-driven
      - team player
      - self-starter
      - go-getter
      - hardworking
      - dynamic
      - fast-paced
      - passion for
      - excellent communication skills

# The Jobs tab: open internships and new-grad jobs, read from SimplifyJobs and company career pages (public addresses; nothing
# about you is sent anywhere). The AI never changes this file; you can. Delete this whole block to get the defaults.
feed:
  auto_refresh: true            # read the sources when you open the Jobs tab and the list is over a day old
  tracks: [cs, ece, business]   # which jobs to show: cs, ece, business, other
  kinds: [internship, newgrad]
  terms: ["Summer 2027"]        # internship terms to keep
  # keywords:                   # extra words, matched in the job title, that put a job in a track
  #   cs: [quant dev]
  # companies:                  # add a company career page (ats: greenhouse, lever, ashby, smartrecruiters or workable)
  #   - {name: Example Co, ats: greenhouse, board: exampleco}
  # skip_companies: [Stripe]    # leave one of the built-in companies out
  h1b: true                     # show what each employer filed with the Labor Department (downloads one ~8 MB public file)
  hide_citizenship_required: true

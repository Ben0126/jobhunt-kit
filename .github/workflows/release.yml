# 發布版本：推 v0.6 或 v0.6.1 這種格式的 tag 就會跑（v0.6-rc1 這種測試用 tag 不會觸發，避免測試版變成「最新版」）。
# 1) 在 Windows / Apple 晶片 Mac / Intel Mac 上各自測試、打包程式（步驟和 app.yml 相同）。
# 2) 每個平台只打包一次程式，再和「合一版」資料夾（app/kitbuild.ts 從台灣版、美國版和 scaffold/kit 組出來）包成
#    「解壓縮就能用」的 zip：job-hunt-kit 資料夾 → jobhunt-kit-windows.zip / jobhunt-kit-mac-apple.zip / jobhunt-kit-mac-intel.zip。
#    使用者第一次用時選「美國／台灣／兩邊」，程式（jobhunt mode）把那一套規則裝好。
# 3) 建立 GitHub Release（公開下載頁），放上三個 zip。
# 固定下載連結：https://github.com/<repo>/releases/latest/download/jobhunt-kit-windows.zip（其他同理）。
# 舊的分開兩套（job-hunt-*.zip、job-hunt-us-*.zip）不再發布：舊版的一鍵更新找不到新檔名，會請使用者照說明下載新版。
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "要發布的 tag（必須已經推到 GitHub，格式像 v0.6 或 v0.6.1）"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: win
            bin: jobhunt.exe
            suffix: windows
            py: python
          - name: macos-arm64
            os: macos-latest
            target: mac-arm64
            bin: jobhunt-mac-arm64
            suffix: mac-apple
            py: python3
          - name: macos-x64
            # macos-13 已退役；目前的 Intel runner 是 macos-15-intel
            os: macos-15-intel
            target: mac-x64
            bin: jobhunt-mac-x64
            suffix: mac-intel
            py: python3
    defaults:
      run:
        shell: bash
        working-directory: jobhunt-kit/app
    steps:
      # 手動執行時填的 tag 也要是 v0.6 / v0.6.1 這種格式，不對就馬上停。
      - name: Check tag format
        working-directory: ${{ github.workspace }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "tag must look like v0.6 or v0.6.1, got: $TAG"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 沒寫這一版的「這次改了什麼」就不發布（避免發布頁空白或留著範例文字）。
      - name: Check release notes exist
        working-directory: ${{ github.workspace }}
        run: |
          for f in "release-notes/$TAG.zh.md" "release-notes/$TAG.en.md"; do
            test -s "$f" || { echo "missing $f: write what changed in this release before tagging"; exit 1; }
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Unit tests
        run: bun test

      # 把 tag 去掉開頭的 v 當版本號包進程式（jobhunt --version 會印出來；介面的「有新版本」提醒也用它比較）。
      - name: Build
        run: bun build.ts --target ${{ matrix.target }} --version "${TAG#v}"

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - "dist/${{ matrix.bin }}"
          codesign -v --verbose=2 "dist/${{ matrix.bin }}"

      # --expect-version：程式回報的版本號必須等於 tag（去掉 v）。
      - name: Smoke test the compiled binary
        run: bun tests/smoke.ts "dist/${{ matrix.bin }}" --expect-version "${TAG#v}"

      # 美國版：同一個程式，對美國版資料夾再跑一次，輸出要全英文。
      - name: Smoke test the compiled binary (US kit)
        run: bun tests/smoke.ts "dist/${{ matrix.bin }}" --us --expect-version "${TAG#v}"

      # 只會帶到 git 追蹤的檔案（CI 是全新 checkout），本機的暫存檔不會被包進去。
      # 合一版：kitbuild.ts 組出 pkg/job-hunt-kit（三套規則在 .kit/，選了模式才裝到最上層），再放進這個平台的程式。
      - name: Assemble the ready-to-use folder
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf pkg
          mkdir pkg
          bun jobhunt-kit/app/kitbuild.ts pkg/job-hunt-kit
          cp "jobhunt-kit/app/dist/${{ matrix.bin }}" "pkg/job-hunt-kit/${{ matrix.bin }}"
          if [ "$RUNNER_OS" = "macOS" ]; then chmod 755 "pkg/job-hunt-kit/${{ matrix.bin }}"; fi
          ls -la pkg/job-hunt-kit

      # Windows PowerShell 5.1 的 Compress-Archive：中文檔名寫成 UTF-8 並標上 UTF-8 旗標（已在本機 Windows 11 實測）。
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ github.workspace }}/pkg
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path job-hunt-kit -DestinationPath 'jobhunt-kit-${{ matrix.suffix }}.zip'

      # ditto 保留執行權限和 UTF-8 檔名；不帶 Mac 專用的附加資料，避免多出 __MACOSX、._ 檔。
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}/pkg
        run: |
          ditto -c -k --norsrc --noextattr --noacl --keepParent job-hunt-kit "jobhunt-kit-${{ matrix.suffix }}.zip"

      # 檢查 zip 裡的檔案和資料夾都和來源一模一樣（不多不少）、檔名沒有變亂碼、Mac 程式有執行權限、必要檔案都在。
      - name: Verify the zips
        working-directory: ${{ github.workspace }}/pkg
        env:
          SUFFIX: ${{ matrix.suffix }}
          BIN: ${{ matrix.bin }}
          PYTHONIOENCODING: utf-8
        run: |
          ${{ matrix.py }} - <<'PY'
          import os, sys, zipfile

          suffix, binname = os.environ["SUFFIX"], os.environ["BIN"]
          is_mac = os.environ["RUNNER_OS"] == "macOS"

          # 每套資料夾：(zip 檔名, 資料夾名, 必要檔案)
          kits = [
              ("jobhunt-kit-%s.zip" % suffix, "job-hunt-kit", [
                  "AGENTS.md",  # the setup rules until a mode is chosen
                  "START-HERE.md",
                  "開始使用.md",  # 開始使用.md
                  "opening-prompt.txt",
                  "開場句.txt",  # 開場句.txt
                  "jobhunt.yaml",
                  "templates/resume-us.html",
                  "templates/resume-tw.html",
                  ".claude/settings.json",
                  ".codex/rules/jobhunt.rules",
                  ".kit/us/AGENTS.md",
                  ".kit/tw/AGENTS.md",
                  ".kit/both/AGENTS.md",
                  ".kit/both/playbooks/taiwan.md",
                  ".kit/both/skills/start/SKILL.md",
              ]),
          ]

          problems = []
          for zpath, src, must_files in kits:
              expected = set()
              for root, _dirs, files in os.walk(src):
                  for f in files:
                      expected.add(os.path.join(root, f).replace(os.sep, "/"))

              got, utf8_flagged = {}, 0
              with zipfile.ZipFile(zpath) as z:
                  for info in z.infolist():
                      name = info.filename
                      if info.flag_bits & 0x800:
                          utf8_flagged += 1
                      else:
                          # 沒標 UTF-8 旗標時 Python 用 cp437 解碼；還原成原始位元組再用 UTF-8 解
                          try:
                              name = name.encode("cp437").decode("utf-8")
                          except UnicodeError:
                              problems.append(zpath + ": name is not UTF-8: " + ascii(name))
                      if "\\" in name:
                          problems.append(zpath + ": backslash in entry name: " + ascii(name))
                      if name.endswith("/"):
                          continue
                      got[name] = info

              for n in sorted(expected - set(got)):
                  problems.append(zpath + ": missing from zip: " + ascii(n))
              for n in sorted(set(got) - expected):
                  problems.append(zpath + ": unexpected in zip: " + ascii(n))

              for n in [src + "/" + f for f in must_files] + [src + "/" + binname]:
                  if n not in got:
                      problems.append(zpath + ": required file missing: " + ascii(n))

              if is_mac and (src + "/" + binname) in got:
                  mode = got[src + "/" + binname].external_attr >> 16
                  if not mode & 0o111:
                      problems.append(zpath + ": program lost its exec bit: mode=%o" % mode)
                  else:
                      print("exec bit ok: mode=%o" % mode)

              print("%s: %d files, %d entries flagged UTF-8, %.1f MB" % (
                  zpath, len(got), utf8_flagged, os.path.getsize(zpath) / 1048576))
              for n in sorted(got):
                  print("  " + n)
          if problems:
              print("\n".join("FAIL " + p for p in problems))
              sys.exit(1)
          PY

      # 把 zip 解到另一個地方，對「解出來的程式」再測一次，確認解壓縮就能用；要上傳的 zip 不動。
      - name: Unzip a throwaway copy (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ github.workspace }}/pkg
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path 'jobhunt-kit-${{ matrix.suffix }}.zip' -DestinationPath (Join-Path $env:RUNNER_TEMP 'unzipped')

      - name: Unzip a throwaway copy (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}/pkg
        run: |
          ditto -x -k "jobhunt-kit-${{ matrix.suffix }}.zip" "$RUNNER_TEMP/unzipped"

      - name: Test the unzipped program
        env:
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/unzipped/job-hunt-kit"
          if [ "$RUNNER_OS" = "macOS" ]; then codesign -v --verbose=2 "$dir/$BIN"; fi
          # smoke_one.ts works on a copy: check before a choice, `mode both`, refusing to remove a market, check, the app
          bun tests/smoke_one.ts "$dir/$BIN" "$dir" --expect-version "${TAG#v}"
          # and in the unzipped folder itself: the program must recognise it before any choice (2 = not recognised)
          code=0
          (cd "$dir" && "./$BIN" check) || code=$?
          [ "$code" -eq 0 ] || { echo "check in the unzipped folder exited $code (expected 0)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: jobhunt-kit-${{ matrix.suffix }}.zip
          path: pkg/jobhunt-kit-${{ matrix.suffix }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 每個版本「這次改了什麼」寫在 release-notes/<tag>.zh.md 和 <tag>.en.md（發版前 commit 進 repo）。
      # 發布頁以英文為主：本文放 .en.md，第一行連到 .zh.md（中文版）和 README.zh-TW.md。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: release-notes

      - uses: actions/download-artifact@v4
        with:
          pattern: jobhunt-kit-*.zip
          path: out
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l out
          for f in jobhunt-kit-windows.zip jobhunt-kit-mac-apple.zip jobhunt-kit-mac-intel.zip; do
            test -s "out/$f" || { echo "missing out/$f"; exit 1; }
          done

          NOTES_EN=$(cat "release-notes/$TAG.en.md")

          cat > notes.md <<EOF
          繁體中文 (Traditional Chinese)：[本版更新說明](https://github.com/${REPO}/blob/${TAG}/release-notes/${TAG}.zh.md) | [下載與安裝說明 README.zh-TW.md](https://github.com/${REPO}/blob/${TAG}/README.zh-TW.md)

          Download one zip, unzip it, and open the start guide inside (START-HERE.md, or 開始使用.md in Chinese; any text editor works). Then follow it step by step. The first time, you choose where you are looking for work: the United States, Taiwan, or both.

          ## What changed

          ${NOTES_EN}

          ## Already using an older version?

          Versions up to v0.9 came as two separate kits (job-hunt for Taiwan, job-hunt-us for the US). This version is one kit for both, so please set up a new folder with it:

          1. Download and unzip the new zip into a new place (do not unzip it over your current folder).
          2. Keep your old folder as it is; nothing in it is changed or deleted.

          **Do not unzip the whole zip over your job-search folder.** Its resume.yaml and data/applications.csv are blank templates and would replace your confirmed experience and your application progress.

          ## Which file to download

          Download one zip. Scroll down to "Assets" and click the file name; you do not need to sign in to GitHub. The "Source code" files are for developers; you do not need them.

          One kit for the United States, Taiwan, or both. If unzipping gives you a folder inside a folder, use the inner job-hunt-kit folder, the one that contains START-HERE.md.

          - Windows: [jobhunt-kit-windows.zip](https://github.com/${REPO}/releases/latest/download/jobhunt-kit-windows.zip)
          - Mac with Apple silicon (M1, M2, M3, M4): [jobhunt-kit-mac-apple.zip](https://github.com/${REPO}/releases/latest/download/jobhunt-kit-mac-apple.zip)
          - Mac with an Intel processor: [jobhunt-kit-mac-intel.zip](https://github.com/${REPO}/releases/latest/download/jobhunt-kit-mac-intel.zip)

          Not sure which Mac you have: Apple menu, then "About This Mac". "Chip: Apple M..." means Apple silicon; "Processor: Intel" means Intel.

          ## Requirements

          - A paid Claude plan (Pro or above). The free plan cannot use the Code tab.
          - The Claude desktop app (https://claude.ai/download), using its Code tab.

          ## The program is not code-signed

          The jobhunt program in the folder has no paid code signature from Microsoft or Apple, so Windows and macOS show a warning the first time you open it. This is expected. The start guide (START-HERE.md, or 開始使用.md in Chinese) explains what to click in its "Open the app" section (打開介面 in Chinese).

          ## More information

          https://github.com/${REPO}#readme
          EOF
          cat notes.md

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its zip files."
            gh release upload "$TAG" out/*.zip --repo "$REPO" --clobber
            # 上次若在上傳途中失敗，可能留下草稿；確保它是正式發布的（已發布的不受影響）。
            gh release edit "$TAG" --repo "$REPO" --draft=false
          else
            # 補發比目前「最新版」還舊的版本時，不要把 latest 連結搶過去。
            latest_flag=()
            cur=$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null || true)
            if [ -n "$cur" ] && [ "$(printf '%s\n%s\n' "$cur" "$TAG" | sort -V | tail -n1)" = "$cur" ]; then
              echo "Current latest is $cur, newer than $TAG; not marking $TAG as latest."
              latest_flag=(--latest=false)
            fi
            gh release create "$TAG" out/*.zip --repo "$REPO" --verify-tag "${latest_flag[@]}" \
              --title "jobhunt-kit $TAG" --notes-file notes.md
          fi
